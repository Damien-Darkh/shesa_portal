# root/authentik/blueprints/shesa-portal.yaml
# Everything the portal needs from Authentik, so a fresh install needs no GUI work:
#   - OIDC provider and application
#   - logout flow: end the session, then redirect to the portal (no confirmation page)
#   - login redirect: users who open Authentik's own login page directly are sent
#     to the portal instead of Authentik's user profile (superusers are exempt)
# Values come from .env: OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_REDIRECT_URI, PORTAL_BASE_URL
version: 1
metadata:
  name: Shesa Portal - OIDC sign-in, logout and login redirect
  labels:
    blueprints.goauthentik.io/description: OIDC provider, logout flow and login redirect for the Shesa employee portal
entries:
  # ---- Logout flow: logout stage, then redirect to the portal ----
  - model: authentik_flows.flow
    id: portal-logout-flow
    state: present
    identifiers:
      slug: shesa-portal-logout
    attrs:
      name: Shesa Portal logout
      title: Signing out
      designation: invalidation
      authentication: none
      policy_engine_mode: any

  - model: authentik_stages_user_logout.userlogoutstage
    id: portal-logout-stage
    state: present
    identifiers:
      name: shesa-portal-user-logout

  - model: authentik_stages_redirect.redirectstage
    id: portal-logout-redirect
    state: present
    identifiers:
      name: shesa-portal-logout-redirect
    attrs:
      mode: static
      target_static: !Format ["%s/logout.html?signedout=1", !Env [PORTAL_BASE_URL, "http://localhost:8000"]]

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf portal-logout-flow
      stage: !KeyOf portal-logout-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf portal-logout-flow
      stage: !KeyOf portal-logout-redirect
      order: 20

  # ---- OIDC provider and application ----
  - model: authentik_providers_oauth2.oauth2provider
    id: portal-provider
    state: present
    identifiers:
      name: Shesa Portal
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf portal-logout-flow
      client_type: confidential
      client_id: !Env [OIDC_CLIENT_ID, shesa-client]
      client_secret: !Env [OIDC_CLIENT_SECRET, change-me-client-secret]
      redirect_uris:
        - matching_mode: strict
          url: !Env [OIDC_REDIRECT_URI, "http://localhost:8000/accounts/oidc/authentik/login/callback/"]
        - matching_mode: strict
          url: "http://127.0.0.1:8000/accounts/oidc/authentik/login/callback/"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: portal-app
    identifiers:
      slug: shesa
    attrs:
      name: Shesa Portal
      provider: !KeyOf portal-provider
      meta_launch_url: !Format ["%s/accounts/oidc/authentik/login/", !Env [PORTAL_BASE_URL, "http://localhost:8000"]]

  # ---- Login redirect: non-admins who log in directly on Authentik go to the portal ----
  - model: authentik_policies_expression.expressionpolicy
    id: direct-login-policy
    state: present
    identifiers:
      name: direct-login-non-admin
    attrs:
      expression: |
        # Superusers stay on Authentik. Everyone else is redirected, unless the
        # login was started by the portal (next points at the OIDC authorize URL).
        if request.user.is_superuser:
            return False
        http_request = request.http_request
        nxt = http_request.GET.get("next", "") if http_request else ""
        return "/application/o/authorize" not in nxt

  - model: authentik_stages_redirect.redirectstage
    id: portal-login-redirect
    state: present
    identifiers:
      name: shesa-portal-login-redirect
    attrs:
      mode: static
      target_static: !Format ["%s/accounts/oidc/authentik/login/", !Env [PORTAL_BASE_URL, "http://localhost:8000"]]

  - model: authentik_flows.flowstagebinding
    id: portal-login-redirect-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf portal-login-redirect
      order: 110
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf portal-login-redirect-binding
      policy: !KeyOf direct-login-policy
      order: 0
    attrs:
      negate: false
      enabled: true