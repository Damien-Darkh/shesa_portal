<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>Account disabled - Employee Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <script src="./vendor/lucide.min.js"></script>
</head>
<body>
  <!-- No app nav here: a disabled account has no working session, same as app.py
       returning a bare 403 string for this case. Logo-only header. -->
  <header class="header">
    <div class="header-container">
      <div class="header-brand">
        <a class="brand-logo-img" href="#"><img src="./logo_full.svg" alt="Company Logo"></a>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="error-page">
      <div class="icon-box" style="background:#fef2f2;color:#dc2626;">
        <i data-lucide="user-x"></i>
      </div>
      <p class="code">Account disabled</p>
      <h1 class="title" style="font-size:1.75rem;">Your account has been disabled</h1>
      <p class="description">An administrator has disabled access for this account, and all of its VPN devices
        have been disconnected. Contact IT if you believe this is a mistake.</p>
    </div>
  </main>

  <script type="module" src="./pages/account_disabled.js"></script>
</body>
</html>
