<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>Add a Device - Employee Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="./vendor/lucide.min.js"></script>
</head>
<body>
<header id="site-header"></header>

  <main class="main-container space-y">
    <div>
      <a href="index.html" class="btn btn-outline" style="margin-bottom: 1rem;">
        <i data-lucide="arrow-left"></i> Back to profile
      </a>
      <div class="page-title-section">
        <p class="subtitle">VPN Access</p>
        <h1 class="title">Add a Device</h1>
        <p class="description">Give this device a name you'll recognize later, e.g., "Work Laptop" or "Phone".</p>
      </div>
    </div>

    <section class="card">
      <form id="add-device-form" class="space-y">
        <div class="form-group">
          <label class="form-label" for="device-name">Device Name</label>
          <input type="text" id="device-name" class="form-input" placeholder="e.g. Work MacBook Pro" required autofocus>
        </div>

        <div class="modal-actions" style="margin-top: 1.5rem;">
          <a href="index.html" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary" style="margin-top:0;">
            <i data-lucide="plus"></i> Create VPN Access
          </button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="./pages/add_device.js"></script>
</body>
</html>
