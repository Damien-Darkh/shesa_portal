<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>Set NAS Password - Employee Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="./vendor/lucide.min.js"></script>
</head>
<body>
<header id="site-header"></header>

  <main class="main-container space-y">
    <div class="page-title-section">
      <p class="subtitle">Credentials</p>
      <h1 class="title">Set Your NAS Password</h1>
      <p class="description">Update your login credentials for company file servers (Synology NAS).</p>
    </div>

    <form id="password-form" class="card space-y">
      <p class="form-hint" style="margin-bottom: 1rem;">
        Passwords must be at least 8 characters long, contain uppercase and lowercase letters, include at least one number, and must not contain your name.
      </p>

      <div class="form-group">
        <label class="form-label" for="new-pw">New Password</label>
        <input type="password" id="new-pw" class="form-input" minlength="8" required placeholder="At least 8 characters">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-pw">Confirm New Password</label>
        <input type="password" id="confirm-pw" class="form-input" minlength="8" required placeholder="Repeat new password">
      </div>

      <div class="modal-actions" style="margin-top: 1.5rem;">
        <a href="index.html" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary" style="margin-top:0;">
          <i data-lucide="key-round"></i> Set Password
        </button>
      </div>
    </form>
  </main>

  <script type="module" src="./pages/change_dsm_password.js"></script>
</body>
</html>
