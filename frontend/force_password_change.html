<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>Set your NAS password - Employee Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <script src="./vendor/lucide.min.js"></script>
</head>
<body>
  <!-- Forced flow: no app nav, so the user can't skip past it (matches app.py's redirect
       when dsm_must_change_password is set). Only a logo and a log-out link. -->
  <header class="header">
    <div class="header-container">
      <div class="header-brand">
        <a class="brand-logo-img" href="#"><img src="./logo_full.svg" alt="Company Logo"></a>
      </div>
      <a href="/logout" class="nav-link">Log out</a>
    </div>
  </header>

  <main class="main-container space-y form-narrow" style="margin:0 auto;">
    <div class="page-title-section" style="margin-bottom:0;">
      <p class="subtitle">Action required</p>
      <h1 class="title" style="font-size:1.75rem;">Set your NAS password</h1>
    </div>

    <div class="callout callout--warning">
      <i data-lucide="triangle-alert"></i>
      <div><strong>You're using a temporary password.</strong> Choose your own to continue. You can't open the portal until this is done.</div>
    </div>

    <form id="pw-form" class="card space-y" novalidate>
      <div class="form-group">
        <label class="form-label" for="new-pw">New password</label>
        <div class="password-field">
          <input type="password" id="new-pw" class="form-input" autocomplete="new-password" autofocus>
          <button type="button" class="pw-toggle" data-target="new-pw" aria-label="Show password"><i data-lucide="eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-pw">Confirm new password</label>
        <div class="password-field">
          <input type="password" id="confirm-pw" class="form-input" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="confirm-pw" aria-label="Show password"><i data-lucide="eye"></i></button>
        </div>
      </div>

      <ul class="req-list" id="reqs" aria-live="polite"></ul>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="margin-top:.5rem;" disabled>
        <i data-lucide="key-round"></i> Set password and continue
      </button>
    </form>
  </main>

  <script type="module" src="./pages/force_password_change.js"></script>
</body>
</html>
