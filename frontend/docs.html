<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>Documentation - Employee Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <script src="./vendor/lucide.min.js"></script>
  <style>
    .docs-layout { display: grid; gap: 1.5rem; }
    @media (min-width: 900px) { .docs-layout { grid-template-columns: 17rem 1fr; align-items: start; } }
    .docs-toc { position: sticky; top: 5rem; max-height: calc(100dvh - 6rem); overflow-y: auto; padding: 1rem; }
    .docs-toc ul { list-style: none; display: grid; gap: .15rem; }
    .docs-toc a { display: block; padding: .35rem .6rem; border-radius: .5rem; font-size: .8125rem; color: #475569; }
    .docs-toc a:hover, .docs-toc a[aria-current="true"] { background: var(--accent-light); color: var(--primary); }
    .docs-toc .lvl-3 { padding-left: 1.1rem; font-size: .78rem; }
    .docs-body { padding: 2rem; min-width: 0; }
    .docs-body h1 { font-size: 1.9rem; margin: 0 0 1rem; }
    .docs-body h2 { font-size: 1.4rem; margin: 2rem 0 .75rem; scroll-margin-top: 5rem; }
    .docs-body h3 { font-size: 1.1rem; margin: 1.5rem 0 .5rem; scroll-margin-top: 5rem; }
    .docs-body p, .docs-body li { line-height: 1.65; color: #334155; font-size: .9375rem; }
    .docs-body ul, .docs-body ol { margin: .5rem 0 .5rem 1.4rem; }
    .docs-body pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: .75rem; overflow-x: auto; font-size: .8rem; }
    .docs-body code { font-family: ui-monospace, Consolas, monospace; font-size: .85em; background: #f1f5f9; padding: .1rem .35rem; border-radius: .3rem; }
    .docs-body pre code { background: none; padding: 0; color: inherit; }
    .docs-body table { width: 100%; border-collapse: collapse; font-size: .85rem; display: block; overflow-x: auto; }
    .docs-body th, .docs-body td { border: 1px solid var(--border-color); padding: .5rem .65rem; text-align: left; vertical-align: top; }
    .docs-body th { background: #f8fafc; }
    .docs-body a { color: var(--accent-text); text-decoration: underline; }
    .docs-body hr { border: 0; border-top: 1px solid var(--border-color); margin: 2rem 0; }
    .docs-body blockquote { border-left: 3px solid #cbd5e1; padding-left: .9rem; color: #475569; }
    .docs-toolbar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
    .docs-search { position: relative; flex: 1 1 16rem; max-width: 26rem; }
    .docs-search svg { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); }
    .docs-search .form-input { padding-left: 2.5rem; }
    .docs-toc-toggle { display: none; }
    @media (max-width: 899px) {
      .docs-toc-toggle { display: inline-flex; }
      .docs-toc { display: none; position: static; max-height: none; }
      .docs-toc.open { display: block; }
      .docs-body { padding: 1.25rem; }
    }
    mark { background: #fef08a; padding: 0 .1rem; border-radius: .2rem; }
  </style>
</head>
<body>
<header id="site-header"></header>

  <main class="main-container space-y">
    <div class="page-title-section row-between">
      <div>
        <p class="subtitle">Administration</p>
        <h1 class="title">Documentation</h1>
        <p class="description">The complete SHESA Portal manual: installation, operation, modification and use.</p>
      </div>
      <a class="btn btn-primary" id="docs-download" href="/api/docs/manual.md" download="manual.md" style="margin-top:0;">
        <i data-lucide="download"></i> Download manual.md
      </a>
    </div>

    <div class="docs-toolbar">
      <div class="docs-search">
        <i data-lucide="search"></i>
        <input type="search" id="docs-search" class="form-input" placeholder="Search the manual…" aria-label="Search the manual">
      </div>
      <button type="button" class="btn btn-outline docs-toc-toggle" id="toc-toggle" aria-expanded="false" style="margin-top:0;">
        <i data-lucide="list"></i> Contents
      </button>
    </div>

    <p class="card-subtitle" id="docs-status" role="status">Loading the manual…</p>

    <div class="docs-layout">
      <nav class="card docs-toc" id="docs-toc" aria-label="Manual contents"></nav>
      <article class="card docs-body" id="docs-body" tabindex="-1"></article>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script type="module" src="./pages/docs.js"></script>
</body>
</html>
